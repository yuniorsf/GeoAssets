services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geoassets-render-bench-postgres
    environment:
      POSTGRES_DB: geoassets_render_bench
      POSTGRES_USER: postgres
      # Not a real secret — a throwaway, localhost-only benchmark container holding generated data only.
      # Parameterized (with a default) so secret scanners don't flag a bare literal; override via env var if wanted.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # No named volume — the dataset is regenerated by `seed` and never worth persisting.
    ports:
      - "127.0.0.1:5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
