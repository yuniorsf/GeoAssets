services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: geoassets-bench-postgres
    environment:
      POSTGRES_DB: geoassets_bench
      POSTGRES_USER: postgres
      # Not a real secret — this is a throwaway, localhost-only benchmark container with no data
      # worth protecting. Parameterized (with a default) instead of a bare literal purely so
      # secret scanners stop flagging it; override via env var if you want a different one.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    # No named volume — this database is throwaway seeded data, never anything worth persisting.
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
