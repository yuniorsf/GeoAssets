<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
    <meta charset="utf-8" />

    <!-- Resolves the theme (dark/light/system) synchronously before first paint, so there's no
         flash of the wrong theme while the WASM runtime boots (App.razor's own ThemeService.InitAsync
         only runs once Blazor starts, by which point the browser has already painted this page —
         see BlazorThemeService's doc comment). Must stay in sync with BlazorThemeService.ResolveTheme. -->
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('geoassets.theme');
                var mode = stored || 'system';
                var theme = mode === 'system'
                    ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
                    : mode;
                document.documentElement.setAttribute('data-bs-theme', theme);
            } catch (e) {
                // localStorage/matchMedia unavailable — keep the static dark default below.
            }
        })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GeoAssets — GIS Multiplataforma</title>
    <base href="/" />

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous" />

    <!-- Leaflet-Geoman CSS -->
    <link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.css" />

    <!-- Bootstrap 5 (from Shared RCL) — loaded before geoassets.css so the Catppuccin token bridge below wins the cascade -->
    <link rel="stylesheet" href="_content/GeoAssets.Shared/lib/bootstrap/dist/css/bootstrap.min.css" />

    <!-- GeoAssets styles (from Shared RCL) -->
    <link rel="stylesheet" href="_content/GeoAssets.Shared/css/geoassets.css" />

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
</head>

<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bs-body-bg);color:var(--text-primary);font-family:system-ui">
            <div style="text-align:center">
                <div style="font-size:3rem;margin-bottom:1rem">🗺️</div>
                <p>Cargando GeoAssets...</p>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui" style="display:none;position:fixed;bottom:0;width:100%;background:var(--danger);color:var(--on-accent);padding:8px 16px;text-align:center;z-index:9999">
        Ha ocurrido un error.
        <a href="." style="font-weight:bold">Recargar</a>
        <span onclick="this.parentElement.style.display='none'" style="cursor:pointer;float:right">✕</span>
    </div>

    <!-- Application Insights JS SDK — direct load. Initialized from C# (AppInsightsService,
         called from Program.cs) once Blazor reads the connection string from configuration
         (Observability:AzureMonitor:ConnectionString) rather than hardcoding it here (XD01-53):
         this file is served as a static asset regardless of git, so a value hardcoded here would
         be just as committed-and-exposed as one in appsettings.json. -->
    <script src="https://js.monitor.azure.com/scripts/b/ai.3.gbl.min.js"></script>
    <script>
        var ai = null;

        // C#-callable helpers (called via IJSRuntime from AppInsightsService)
        window.appInsightsInterop = {
            init: function (connectionString) {
                if (ai || !connectionString) return;
                ai = new Microsoft.ApplicationInsights.ApplicationInsights({ config: {
                    connectionString: connectionString,
                    enableAutoRouteTracking: true
                }});
                ai.loadAppInsights();
                ai.trackPageView();
                window.appInsights = ai;
            },
            trackEvent:     function (name, props)              { if (ai) ai.trackEvent({ name: name }, props); },
            trackTrace:     function (message, severity, props) { if (ai) ai.trackTrace({ message: message, severityLevel: severity }, props); },
            trackException: function (message, props)           { if (ai) ai.trackException({ exception: new Error(message) }, props); },
            trackMetric:    function (name, value, props)       { if (ai) ai.trackMetric({ name: name, average: value }, props); },
            setUser:        function (userId)                   { if (ai) ai.setAuthenticatedUserContext(userId); }
        };
    </script>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>

    <!-- Leaflet-Geoman -->
    <script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.3/dist/leaflet-geoman.min.js"></script>

    <!-- GeoAssets interop (from Shared RCL) -->
    <script src="_content/GeoAssets.Shared/js/geoassets.js"></script>

    <!-- Session activity tracking -->
    <script src="js/session-activity.js"></script>

    <!-- MSAL authentication (must load before Blazor runtime) -->
    <script src="_content/Microsoft.Authentication.WebAssembly.Msal/AuthenticationService.js"></script>

    <!-- Blazor runtime -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
