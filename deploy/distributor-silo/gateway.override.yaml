# Adds the company silos to deploy/server's gateway (XD01-447) without editing deploy/server/docker-compose.yaml: the
# gateway also reads deploy/distributor-silo/gateway-silos.env, one Destinations__GeoAssets__Silos__<tenant domain> line
# per silo (copy gateway-silos.env.example). Recreate only the gateway, from the repo root:
#
#   docker compose -f deploy/server/docker-compose.yaml -f deploy/distributor-silo/gateway.override.yaml up -d --no-deps gateway
#   docker compose -f deploy/docker-compose.yaml -f deploy/distributor-silo/gateway.override.yaml up -d --no-deps gateway
#
# Keep passing this file while silos exist: an `up` of deploy/server without it recreates the gateway without them. See
# README.md "Route the gateway to the silo".
services:
  gateway:
    # Relative paths resolve against the first -f file's directory: the first entry finds the file under deploy/server,
    # the second under deploy/docker-compose.yaml (deploy/). Whichever does not exist is skipped.
    env_file:
      - path: ../distributor-silo/gateway-silos.env
        required: false
      - path: distributor-silo/gateway-silos.env
        required: false
