# The web client. Part of the "geoassets" Compose project: started on its own or through deploy/docker-compose.yaml.
name: geoassets

services:
  web:
    container_name: geoasset-app
    build:
      context: ../..
      dockerfile: apps/GeoAssets.Web/Dockerfile
    environment:
      # XD01-384: the browser reaches every API through the gateway (deploy/server service "gateway", host port 8090) —
      # GeoAssetsServer:BaseUrl, ServiceOrders:ApiBaseUrl, … of appsettings.Production.json are rendered from these at start.
      GEOASSETS_GATEWAY_URL: ${GEOASSETS_GATEWAY_URL:-http://localhost:8090}
      GEOASSETS_IPBILLING_SERVER_URL: ${GEOASSETS_IPBILLING_SERVER_URL:-http://localhost:8090}
      # Observability:AzureMonitor:ConnectionString — the browser's Application Insights connection string; unset = no telemetry.
      GEOASSETS_APPINSIGHTS_CONNECTION_STRING: ${GEOASSETS_APPINSIGHTS_CONNECTION_STRING:-}
      # Browser telemetry stays off until you start the stack with GEOASSETS_TELEMETRY_EXPORT=true (Observability:ExportEnabled,
      # the same switch as the server stacks' OTLP export).
      GEOASSETS_TELEMETRY_EXPORT: ${GEOASSETS_TELEMETRY_EXPORT:-false}
      # The CIAM sign-in settings (AzureAdCiam:Authority/ClientId, GeoAssetsServer:ApiScope, GeoAssetsIpBillingServer:ApiScope)
      # — set them in .env (see .env.example); unset = appsettings.json's placeholders, and sign-in fails.
      GEOASSETS_CIAM_AUTHORITY: ${GEOASSETS_CIAM_AUTHORITY:-https://YOUR_TENANT_SUBDOMAIN.ciamlogin.com/YOUR_CIAM_TENANT_ID}
      GEOASSETS_CIAM_CLIENT_ID: ${GEOASSETS_CIAM_CLIENT_ID:-YOUR_WEB_CLIENT_ID}
      GEOASSETS_API_SCOPE: ${GEOASSETS_API_SCOPE:-api://YOUR_SERVER_API_CLIENT_ID/access_as_user}
      GEOASSETS_IPBILLING_API_SCOPE: ${GEOASSETS_IPBILLING_API_SCOPE:-}
    ports:
      - "127.0.0.1:8081:8080"
    # BusyBox wget of the nginx-unprivileged (Alpine) image.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
