# The web client. Part of the "geoassets" Compose project: started on its own or through deploy/docker-compose.yaml.
name: geoassets

services:
  web:
    container_name: geoasset-app
    build:
      context: ../..
      dockerfile: apps/GeoAssets.Web/Dockerfile
    environment:
      # XD01-384: the browser reaches every API through the gateway (deploy/server service "gateway", host port 8090) —
      # GeoAssetsServer:BaseUrl, ServiceOrders:ApiBaseUrl, … of appsettings.Production.json are rendered from these at start.
      GEOASSETS_GATEWAY_URL: ${GEOASSETS_GATEWAY_URL:-http://localhost:8090}
      GEOASSETS_IPBILLING_SERVER_URL: ${GEOASSETS_IPBILLING_SERVER_URL:-http://localhost:8090}
    ports:
      - "127.0.0.1:8081:8080"
    # BusyBox wget of the nginx-unprivileged (Alpine) image.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
