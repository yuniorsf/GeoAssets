# The kernel stack. Part of the "geoassets" Compose project: started on its own or, with deploy/neutral-operator and
# deploy/web, through deploy/docker-compose.yaml — every service shares the project's network, geoassets_default.
name: geoassets

services:
  postgres:
    # postgis/postgis publishes linux/amd64 only (its index lists no arm64 image): on Apple Silicon it runs emulated.
    image: postgis/postgis:16-3.5@sha256:94146ac37bc61e2322f88016056c5920729cb8c64c8542ed590af8fc2abdac07
    container_name: PostgresL
    environment:
      POSTGRES_DB: geoassets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/server/.env}
    volumes:
      - geoassets-postgres-data:/var/lib/postgresql/data
    ports:
      # Host-side 5433, not 5432 — avoids colliding with a native Postgres
      # already listening on the host's 5432. Container-to-container traffic
      # (the server service below) still uses the standard 5432 internally.
      # Loopback only, like every published port of this stack.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    container_name: geoasset-server
    build:
      context: ../..
      dockerfile: apps/GeoAssets.Server/Dockerfile
    # NEW_RELIC_LICENSE_KEY (and the other vendor credentials) come from the
    # same Key Vault-backed .env used by the local OTel Collector — see
    # deploy/otel/README.md "Pulling credentials from Key Vault instead".
    # Run `deploy/otel/fetch-secrets.sh` (or copy deploy/otel/.env.example)
    # and start the stack with GEOASSETS_TELEMETRY_EXPORT=true to export
    # telemetry; without both the server still starts, exporting nothing to a
    # vendor.
    env_file:
      - path: ../otel/.env
        required: false
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Telemetry export to the vendors of ../otel/.env stays off until you start the stack with
      # GEOASSETS_TELEMETRY_EXPORT=true (e.g. `GEOASSETS_TELEMETRY_EXPORT=true docker compose up -d`).
      Observability__ExportEnabled: ${GEOASSETS_TELEMETRY_EXPORT:-false}
      ConnectionStrings__GeoAssets: Host=postgres;Port=5432;Database=geoassets;Username=postgres;Password=${POSTGRES_PASSWORD}
      # XD01-384: appsettings.json no longer lists 'neutral-operator' (the cut-over to GeoAssets.NeutralOperator.Server), but
      # this local stack keeps the kernel hosting it: it has no GeoAssets.ServiceCaller credentials (NeutralOperator.Server's
      # registration would stay Degraded) and no broker (its approval saga needs one). Switch to NeutralOperator.Server with
      # KERNEL_NEUTRAL_OPERATOR_MODULE= (blank) and NEUTRAL_OPERATOR_DESTINATION=http://neutral-operator:8080 in .env, then
      # start deploy/neutral-operator — see deploy/neutral-operator/README.md. Index 1, right after appsettings.json's only
      # entry ('postgres-spatial', XD01-385); the module list reader skips a blank entry.
      GeoAssets__Modules__1: ${KERNEL_NEUTRAL_OPERATOR_MODULE-neutral-operator}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    # GET /healthz over bash's /dev/tcp: the runtime image has no curl or wget.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # XD01-384: the API gateway (YARP) the web client talks to — kernel APIs unchanged (/api/**, /wms, /wfs) and the
  # NeutralOperator vertical at /api/v/neutral-operator/** (rewritten to /api/**). It authorizes nothing: the bearer token
  # goes through untouched, CORS is answered here for the web origin.
  gateway:
    container_name: geoasset-gateway
    build:
      context: ../..
      dockerfile: apps/GeoAssets.Gateway/Dockerfile
    env_file:
      - path: ../otel/.env
        required: false
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Telemetry export to the vendors of ../otel/.env stays off until you start the stack with
      # GEOASSETS_TELEMETRY_EXPORT=true (e.g. `GEOASSETS_TELEMETRY_EXPORT=true docker compose up -d`).
      Observability__ExportEnabled: ${GEOASSETS_TELEMETRY_EXPORT:-false}
      Destinations__GeoAssets__Shared: http://server:8080
      # The kernel while it hosts the module (the default here, see the server service); http://neutral-operator:8080 for
      # deploy/neutral-operator's GeoAssets.NeutralOperator.Server (same network, geoassets_default).
      Destinations__NeutralOperator__Shared: ${NEUTRAL_OPERATOR_DESTINATION:-http://server:8080}
      # Not part of this stack: requests under these prefixes answer 502 until such a host runs at these addresses.
      Destinations__IpBilling__Shared: ${IPBILLING_DESTINATION:-http://ipbilling-server:8080}
      Destinations__FieldService__Shared: ${FIELDSERVICE_DESTINATION:-http://fieldservice-server:8080}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:8081}
      Cors__AllowedOrigins__1: http://localhost:5012
      Cors__AllowedOrigins__2: https://localhost:7124
      # XD01-393: a bucket per caller (organization claim -> token subject -> client IP) and per policy (api; tiles = /wms,
      # /wfs) — the production defaults of docs/perf/gateway-rate-limits.md; raise them here for a heavier local load test.
      RateLimiting__Api__TokenLimit: ${GATEWAY_RATE_LIMIT_API_TOKENS:-500}
      RateLimiting__Tiles__TokenLimit: ${GATEWAY_RATE_LIMIT_TILE_TOKENS:-1000}
      # XD01-398: the CIAM tenant whose signing keys validate the token before its claims key a bucket — the same
      # AzureAdCiam__Instance / AzureAdCiam__TenantId the server service reads from .env. Unset (the default): the token is
      # only decoded, as before, and the gateway logs one startup warning.
      AzureAdCiam__Instance: ${AzureAdCiam__Instance:-}
      AzureAdCiam__TenantId: ${AzureAdCiam__TenantId:-}
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8080"
    # GET /healthz over bash's /dev/tcp: the runtime image has no curl or wget.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /healthz HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # The live local database, created outside Compose so that no `down -v` can delete it (the name it had when this was the
  # "server" project). A fresh machine creates it first: docker volume create server_geoassets-postgres-data
  geoassets-postgres-data:
    name: server_geoassets-postgres-data
    external: true
