# Example overrides for a Tier-2 dedicated silo (XD01-215 AC: "zero source changes required").
# In practice these values are generated by deploy/terraform/tier2-silo and passed to
# `helm upgrade --install` as a generated file or --set-string flags, not hand-edited per tenant —
# this file documents their shape for a manual/first-run onboarding (see the runbook).

multiTenancy:
  mode: DedicatedSingleTenant
  tenantName: CHANGE_ME   # e.g. "acme-utility"

# Point at the tenant's own dedicated Postgres instance/database, provisioned by Terraform.
# Prefer existingSecretName in any real onboarding instead of inlining a connection string here.
existingSecretName: CHANGE_ME-fieldservice-db

replicaCount: 1   # a Tier-2 silo is typically one client's traffic — size up per their SLA
