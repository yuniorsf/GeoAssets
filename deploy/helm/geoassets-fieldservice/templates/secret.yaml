{{- if not .Values.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "geoassets-fieldservice.secretName" . }}
  labels:
    {{- include "geoassets-fieldservice.labels" . | nindent 4 }}
type: Opaque
stringData:
  connectionString: {{ required "connectionString is required when existingSecretName is not set" .Values.connectionString | quote }}
{{- end }}
