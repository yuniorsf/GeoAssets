services:
  # Generic placeholder for whatever application emits OTLP telemetry.
  # Swap the image/command for your real service — the only contract that
  # matters is the OTEL_EXPORTER_OTLP_* environment below. See README.md
  # for the equivalent .NET Program.cs wiring.
  app:
    image: python:3.12-slim
    command: >
      sh -c "pip install --quiet opentelemetry-distro opentelemetry-exporter-otlp &&
             python -c 'print(\"placeholder app — replace with your real service\")' &&
             tail -f /dev/null"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: my-dotnet-service
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    env_file:
      - .env
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
