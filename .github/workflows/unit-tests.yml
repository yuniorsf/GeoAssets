name: Unit Tests

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore
        run: dotnet restore GeoAssets.sln

      - name: Build (Strict Analyzer Gate)
        run: >
          dotnet build GeoAssets.sln
          --no-restore --configuration Release /warnaserror

      - name: Test All Suites
        run: >
          dotnet test GeoAssets.sln
          --no-build --configuration Release
          --filter "Category!=RequiresiOS"
          --logger "trx"
          --results-directory ./TestResults
          --collect:"XPlat Code Coverage"

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: xUnit — GeoAssets Test Suite
          path: TestResults/**/*.trx
          reporter: dotnet-trx
          fail-on-error: true

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: TestResults/**/coverage.cobertura.xml
          retention-days: 14
