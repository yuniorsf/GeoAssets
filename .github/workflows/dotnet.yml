name: .NET Build & Test (Deterministic Oracle)

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Restore packages
        run: dotnet restore GeoAssets.sln

      - name: Oracle Stage 1 — Verify code style (dotnet format style)
        run: dotnet format style GeoAssets.sln --verify-no-changes --no-restore

      - name: Oracle Stage 2 — Strict build & static analyzers (/warnaserror)
        run: dotnet build GeoAssets.sln --no-restore --no-incremental --configuration Release /warnaserror

      - name: Oracle Stage 3 — Architecture invariants
        run: dotnet test GeoAssets.sln --no-build --configuration Release --filter "FullyQualifiedName~Architecture|Category=Architecture"

      - name: Full Test Suite (skip iOS-only tests)
        run: dotnet test GeoAssets.sln --no-build --configuration Release --filter "Category!=RequiresiOS"
